[package]
name = "rx-emby"
version = "0.1.0"
edition = "2021"

[dependencies]
# 异步运行时与 Web 框架
tokio = { version = "1.41", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }

# 序列化与配置
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP 客户端（禁用默认 openssl，改用 rustls 方便交叉编译 NAS 静态二进制）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }

# 缓存、限流、热更新与并发
moka = { version = "0.12", features = ["future"] }
governor = "0.7"
arc-swap = "1.7"
dashmap = "6.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# 加密与编码（AList Sign 计算 & URL 编码）
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2.3"
url = "2.5"
regex = "1.11"
once_cell = "1.20"

# 静态资源内嵌、日志与错误处理
rust-embed = "8.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = false

[profile.release.build-override]
opt-level = 0
strip = false

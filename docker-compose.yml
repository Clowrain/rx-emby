services:
  postgres:
    image: postgres:16-alpine
    container_name: rx-emby-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: media_admin
      POSTGRES_PASSWORD: rx_emby_strong_password
      POSTGRES_DB: xiaoya_media
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "max_connections=50"
    deploy:
      resources:
        limits:
          memory: 1024M

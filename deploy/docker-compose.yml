services:
  postgres:
    image: postgres:16-alpine
    container_name: rx-emby-pg
    restart: unless-stopped
    # 仅绑定宿主机回环地址，默认使用 15432 避开飞牛/NAS 系统自带 PostgreSQL 的 5432 端口
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-media_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xiaoya_media}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${PG_DATA_DIR:-./pg_data}:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "max_connections=50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-media_admin} -d ${POSTGRES_DB:-xiaoya_media}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - default

  rx-emby:
    image: ghcr.io/clowrain/rx-emby:latest
    # 如需本地源码构建，可取消下面注释并注释掉上面的 image 行
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    container_name: rx-emby
    restart: unless-stopped
    # 推荐使用 host 网络（与小雅生态里的 Emby 容器一致），避免跨 Docker 网桥隔离导致小雅 302 内网跳（如 172.17.x.x:45678）超时
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: ${RUST_LOG:-rx_emby=info}
      TZ: ${TZ:-Asia/Shanghai}
      BIND_ADDR: 0.0.0.0:${HTTP_PORT:-23486}
      SERVER_ID: ${SERVER_ID:-rx-emby-nas-01}
      SERVER_NAME: ${SERVER_NAME:-RX-Emby Media Server}
      DATABASE_URL: postgres://${POSTGRES_USER:-media_admin}:${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-15432}/${POSTGRES_DB:-xiaoya_media}
      STRM_TXT_SOURCE: ${STRM_TXT_SOURCE:-/xiaoya-db/strm.txt}
      SYNC_INTERVAL_SEC: ${SYNC_INTERVAL_SEC:-600}
      PARSE_CONCURRENCY: ${PARSE_CONCURRENCY:-16}
      DB_BATCH_SIZE: ${DB_BATCH_SIZE:-5000}
      SYNC_INCLUDE_PREFIXES: ${SYNC_INCLUDE_PREFIXES:-}
      SYNC_EXCLUDE_KEYWORDS: ${SYNC_EXCLUDE_KEYWORDS:-演唱会,短剧,广播剧}
      SYNC_MAX_LINES_LIMIT: ${SYNC_MAX_LINES_LIMIT:-0}
      ALIST_BASE_URL: ${ALIST_BASE_URL:-http://192.168.1.10:5678}
      ALIST_USERNAME: ${ALIST_USERNAME:-dav}
      ALIST_PASSWORD: ${ALIST_PASSWORD:-}
      ALIST_OTP_SECRET: ${ALIST_OTP_SECRET:-}
      ALIST_PATH_PREFIX: ${ALIST_PATH_PREFIX:-}
      ALIST_DIRECT_URL_TTL_SEC: ${ALIST_DIRECT_URL_TTL_SEC:-600}
      SCRAPER_AUTO_BACKGROUND: ${SCRAPER_AUTO_BACKGROUND:-false}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_PROXY_URL: ${TMDB_PROXY_URL:-}
      TMDB_API_BASE_URL: ${TMDB_API_BASE_URL:-https://api.themoviedb.org/3}
      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
      TMDB_RATE_LIMIT_PER_SEC: ${TMDB_RATE_LIMIT_PER_SEC:-4}
      IMAGE_CACHE_DIR: ${IMAGE_CACHE_DIR:-./cache/images}
      IMAGE_CACHE_MAX_SIZE_MB: ${IMAGE_CACHE_MAX_SIZE_MB:-20480}
      IMAGE_CACHE_EVICT_HIGH_WATERMARK: ${IMAGE_CACHE_EVICT_HIGH_WATERMARK:-0.90}
      IMAGE_CACHE_EVICT_LOW_WATERMARK: ${IMAGE_CACHE_EVICT_LOW_WATERMARK:-0.75}
    volumes:
      - ${CACHE_DIR:-./cache}:/app/cache
      # 挂载小雅目录（只读），用于直接读取 strm.txt
      - ${XIAOYA_DIR:-./xiaoya}:/xiaoya-db:ro

networks:
  default:

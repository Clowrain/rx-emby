services:
  postgres:
    image: postgres:16-alpine
    container_name: rx-emby-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: media_admin
      POSTGRES_PASSWORD: rx_emby_strong_password
      POSTGRES_DB: xiaoya_media
      TZ: Asia/Shanghai
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "max_connections=50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_admin -d xiaoya_media"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  rx-emby:
    image: ghcr.io/clowrain/rx-emby:latest
    # 如需本地源码构建，可取消下面注释并注释掉上面的 image 行
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    container_name: rx-emby
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8096:8096"
    environment:
      RUST_LOG: rx_emby=info
      TZ: Asia/Shanghai
    volumes:
      # 启动前请先在同级目录准备好 config.toml 文件，否则 Docker 会将其创建为空目录
      - ./config.toml:/app/config.toml
      - ./cache:/app/cache
